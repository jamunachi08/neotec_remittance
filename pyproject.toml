[project]
name = "neotec_remittance"
authors = [{ name = "Neotec Integrated Solutions", email = "info@neotec.ai" }]
description = "Neotec Remittance — remittance instruction engine, append-only subledger and bank execution for Frappe/ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["cryptography"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
